<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Keenetic Hue architecture</title><desc id="desc">Google Home commands pass through a Cloudflare Worker and outbound Tunnel to the Entware BLE agent and Hue lamp. The router initiates the Tunnel connection.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#489a86"/></marker></defs>
<rect width="1200" height="390" rx="24" fill="#f3f5ef"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="49" fill="#183743" font-size="23" font-weight="700">One lamp. Clear boundaries.</text>
<g fill="#fff" stroke="#c9d8d3" stroke-width="2"><rect x="40" y="111" width="225" height="132" rx="18"/><rect x="335" y="111" width="235" height="132" rx="18"/><rect x="640" y="111" width="235" height="132" rx="18"/><rect x="945" y="111" width="215" height="132" rx="18"/></g>
<g fill="#183743" font-size="23" font-weight="700" text-anchor="middle"><text x="152" y="155">Google Home</text><text x="452" y="155">Cloudflare</text><text x="757" y="155">Keenetic</text><text x="1052" y="155">Hue BLE</text></g>
<g fill="#53706d" font-size="17" text-anchor="middle"><text x="152" y="190">Personal integration</text><text x="452" y="190">Worker + OAuth</text><text x="757" y="190">Entware BLE agent</text><text x="1052" y="190">On/off + brightness</text><text x="452" y="216">HomeGraph reports</text><text x="757" y="216">USB Bluetooth dongle</text></g>
<g fill="none" stroke="#489a86" stroke-width="3" marker-end="url(#arrow)"><path d="M274 177H321"/><path d="M579 177H625"/><path d="M884 177H932"/><path d="M757 256V287H452V256"/></g>
<g fill="#315d55" font-size="15" text-anchor="middle"><text x="300" y="99">HTTPS</text><text x="605" y="99">Tunnel</text><text x="909" y="99">BLE</text><text x="605" y="316">Tunnel connection initiated by the router</text></g>
<text x="42" y="360" fill="#53706d" font-size="16">No inbound port forwarding. Personal credentials stay outside the repository.</text></g></svg>