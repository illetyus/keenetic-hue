version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /cloud
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      cloud-dev-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
