name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-pure-router.txt cryptography==46.0.5
      - run: python -m pip install --no-deps bumble==0.0.236
      - run: python tools/check_publication.py
      - run: python tools/run_portable_tests.py
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
